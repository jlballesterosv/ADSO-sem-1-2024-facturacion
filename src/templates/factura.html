<head>
    <meta charset="UTF-8" />

        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">FACT-3000</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                        data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Productos
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="lista_productos.html">Listar Productos</a>
                        <a class="dropdown-item" href="formulario_producto.html">Crear Producto</a>
                        <a class="dropdown-item" href="factura.html">facturación</a>
                    </div>
                </li>
            </ul>

            <button type="button" class="btn btn-primary" style="margin-right: 10px"
                onclick="window.location.href='formulario_usuario.html'">
                ingresar
            </button>
            <button type="button" class="btn btn-primary" onclick="window.location.href='formulario_Nue_usuario.html'">
                registrarse
            </button>
            </form>
        </div>
    </nav>
    <form id="facturaform">
        <div class="form-row">
            <div class="form-group col-md-6">
                <label for="correo">correo</label>
                <input type="email" class="form-control" id="correo" placeholder="ingrese un correo" required>
            </div>
            <div class="form-group">
                <label for="usuario">nombre de usuario</label>
                <input type="text" class="form-control" id="usuario" placeholder="ingrese un usuario" required>
            </div>


            <div class="form-group col-md-6">
                <label for="area">¿cual es su area?</label>
                <select id="area" class="form-control" required>
                    <option value="">seleccione...</option>
                    <option value="textil">textil</option>
                    <option value="alimentos">alimentos</option>
                    <option value="bebidas">bebidas</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-3">
                <label for="codigoproduct">codigo producto</label>
                <input type="text" class="form-control" id="codigoproduct">
            </div>
            <button type="button" class="btn btn-success" id="agregarproducto">agregarproducto</button>
        </div>

        <button type="submit" class="btn btn-primary mt-3 ">imprimir factura</button>

    </form>

    <div id="factura" style="display: none; margin-top: 20px;">
        <h2>Factura</h2>
        <p><strong>Correo:</strong> <span id="mostrarcorreo"></span></p>
        <p><strong>Usuario:</strong> <span id="mostrarusuario"></span></p>
        <p><strong>Área:</strong> <span id="mostrararea"></span></p>

        <table border="1" width="100%" id="tablafactura">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Unidad</th>
                    <th>Categoría</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <h3>total:$<span id="totalfactura">0</span></h3>
    </div>


    <script>
        const productos = [
            { codigo: "1", descripcion: "Pan tajado bolsa 200 grs", cantidad: "100", precio: 5000, unidad: "Unidad", categoria: "Alimentos" },
            { codigo: "2", descripcion: "Carne cerdo costilla", cantidad: "10000", precio: 32, unidad: "GRS", categoria: "Alimentos" },
            { codigo: "3", descripcion: "Chaqueta cuerina", cantidad: "40", precio: 79900, unidad: "Unidad", categoria: "Ropa" },
            { codigo: "4", descripcion: "Zapatos deportivos", cantidad: "20", precio: 43900, unidad: "Unidad", categoria: "Ropa" },
            { codigo: "5", descripcion: "Energizante Pantera", cantidad: "100", precio: 4500, unidad: "Unidad", categoria: "Bebidas" },
            { codigo: "6", descripcion: "Soda Hatsu", cantidad: "60", precio: 5500, unidad: "Unidad", categoria: "Bebidas" }
        ];
        let total = 0;

        document.getElementById("agregarproducto").addEventListener("click", function () {
            let codigoproducto = document.getElementById("codigoproduct").value.trim();
            let producto = productos.find(p => p.codigo === codigoproducto);

            if (producto) {
                let tbody = document.querySelector("#tablafactura tbody");
                let fila = document.createElement("tr");

                fila.innerHTML = `
                <td>${producto.codigo}</td>
                <td>${producto.descripcion}</td>
                <td>${producto.cantidad}</td>
                <td>$${producto.precio}</td>
                <td>${producto.unidad}</td>
                <td>${producto.categoria}</td>
            `;
                tbody.appendChild(fila);

                total += producto.precio;
                document.getElementById("totalfactura").innerText = `$${total.toLocaleString()}`;

                document.getElementById("factura").style.display = "block";

            } else {
                alert("Código de producto no encontrado.");
            }
        });

        document.getElementById("facturaform").addEventListener("submit", function (event) {
            event.preventDefault();


            document.getElementById("mostrarcorreo").innerText = document.getElementById("correo").value;
            document.getElementById("mostrarusuario").innerText = document.getElementById("usuario").value;
            document.getElementById("mostrararea").innerText = document.getElementById("area").value;

            document.getElementById("factura").style.display = "block";
        });
    </script>


</body>

</html>
