{% extends 'layout.html' %}


{% block contenido %}
<h1>{{ titulo }}</h1>  
  <form action="/se_guardo">    
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="codigo">Código</label>
        <input type="text" class="form-control" id="codigo" placeholder="AAA000000" onblur="validarCodigo()">
        <span id="emailError" class="error" style="display: none;">Invalid email format</span>
      </div>
      <div class="form-group col-md-6">
        <label for="descripcion">Descripción</label>
        <input type="text" class="form-control" id="descripcion" placeholder="Describa el producto (dato único)">
      </div>
      <div class="form-group col-md-6">
        <label for="cantidad_inventario">Cantidad Inventario</label>
        <input type="number" class="form-control" id="cantidad_inventario">
      </div>
      <div class="form-group col-md-6">
        <label for="precio_unitario">Precio Unitario</label>
        <input type="number" class="form-control" id="precio_unitario">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-4">
        <label for="unidad_medida">Unidad de Medida</label>
        <select id="unidad_medida" class="form-control">
          <option selected>Por favor seleccione...</option>
          <option value="GRS">GRS</option>
          <option value="UND">UND</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label for="categoria">Categoria</label>
        <select id="categoria" class="form-control">
          <option selected>Por favor seleccione...</option>
          <option value="1">Alimentos</option>
          <option value="2">Ropa</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form> 
  <script type="text/javascript">
    function validarCodigo() {
      // Code to execute after leaving the input field
      let codiogInputField = document.getElementById("codigo");
      let emailError = document.getElementById('emailError');
      let value = codiogInputField.value;
      var re = new RegExp("[A-Z]{3}[0-9]*");
      if (re.test(value)) {
        console.log("Valid");
        emailError.style.display = 'none';
      } else {
          console.log("Invalid");
          emailError.style.display = 'block';          
      }
      
      console.log("Left the input field "+ value);
    }
  </script>
{% endblock contenido %}
