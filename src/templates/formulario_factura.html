{% extends 'layout.html' %}


{% block contenido %}
<h1>{{ titulo }}</h1>  
  <form action="/formulario_factura" method="post">    
    <div class="form-row">
      
      <div class="form-group col-md-6">
        <label for="codigo">Cédula Cliente</label>
        <input type="text" class="form-control" id="documento_identidad" name="documento_identidad" placeholder="123456789">        
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Nombre</label>
        <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" placeholder="Juan Perez">   
        
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Dirección</label>
        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Cra 23 # 4- 45">   
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Teléfono</label>
        <input type="text" class="form-control" id="telefono" name="telefono" placeholder="123456789">   
      </div>
    </div>
    <div class="form-row">

    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form> 
  <script>
    $("#documento_identidad").change(function() {
        value = $(this).val();
        console.log(value)
        $.ajax({
            type: 'GET',
            url:"/consultar_cliente_por_documento_identidad/" + value,
            contentType: "application/json",
            dataType: 'json',
            succes: function(result) {
                console.log(result)
            }
        })
    });
  </script>
  
{% endblock contenido %}
