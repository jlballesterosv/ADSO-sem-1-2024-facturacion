{% extends 'layout.html' %}


{% block contenido %}
<h1>{{ titulo }}</h1>  
  <form action="/formulario_factura" method="post">    
    <div class="form-row">
      
      <div class="form-group col-md-6">
        <label for="codigo">Cédula Cliente</label>
        <input type="text" class="form-control" id="cedula_cliente" name="cedula_cliente" placeholder="123456789">        
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Nombre</label>
        <input type="text" class="form-control" id="nombre_completo" name="nombre_completo" placeholder="Juan Perez">   
        
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Dirección</label>
        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Cra 23 # 4- 45">   
      </div>
      <div class="form-group col-md-6">
        <label for="codigo">Teléfono</label>
        <input type="text" class="form-control" id="telefono" name="telefono" placeholder="123456789">   
      </div>
    </div>
    <div class="form-row">

    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form> 
  <script>
    $("#cedula_cliente").change(function() {      
        value = $(this).val();
        $.ajax({
          type: "GET",
          url: "/consultar_cliente_numero_identificacion/" + value,
          contentType: "application/json",
          dataType: 'json',
          success: function(result) {
            console.log("Result:");
            console.log(result);
            $('#nombre_completo').val(result.nombre_completo);
            $('#direccion').val(result.direccion);
            $('#telefono').val(result.telefono);
            $('#id_cliente').val(result.id);
            console.log(result)
            $('#email').val(result.email);
          } 
        });
      });
  </script>
  
{% endblock contenido %}
